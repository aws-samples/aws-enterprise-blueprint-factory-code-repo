Parameters:
  ConfigRepositoryName:
    Default: '/blueprints/resources/ConfigRepo'
    Type: 'AWS::SSM::Parameter::Value<String>'
  CodeRepositoryName:
    Default: '/blueprints/resources/CodeRepo'
    Type: 'AWS::SSM::Parameter::Value<String>'
  BlueprintRepositoryName:
    Default: '/blueprints/resources/BlueprintRepo'
    Type: 'AWS::SSM::Parameter::Value<String>'
  BranchName:
    Type: String
    Default: main
  VPCID:
    Default: '/blueprints/resources/vpc_id'
    Type: 'AWS::SSM::Parameter::Value<String>'
    Description: VPC ID of your existing Virtual Private Cloud (VPC)
  # SecurityGroupID:
  #   Type: List<AWS::EC2::SecurityGroup::Id>
  #   Default: '/blueprints/resources/securitygroups'
  Subnets:
    Default: '/blueprints/resources/subnets'
    Type: 'AWS::SSM::Parameter::Value<List<String>>'
  SecurityGroupIds:
    Type: 'AWS::SSM::Parameter::Value<List<String>>'
    Default: '/blueprints/resources/securitygroups'
  BlueprintLaunchRoleNamePattern:
    Type: String
    Default: 'ServiceCatalogLaunchConstraintRole*'
    Description: >-
      IAM role name (or name pattern) of the launch constraint roles referenced by launch_contraint_role in bp_config.yml.
      The pipeline is allowed to pass only these roles to Service Catalog.
  EnvironmentType:
    Type: String
    Default: DEV
    AllowedValues:
      - DEV
      - NONPROD
      - PROD    
  ArtifactBucket:
    Default: '/blueprints/resources/artifacts-bucket-name'
    Type: 'AWS::SSM::Parameter::Value<String>'
    ConstraintDescription: 3-63 characters; must contain only lowercase letters or numbers
  CodeConnectionArn:
    Default: '/blueprints/resources/CodeConnectionArn'
    Type: 'AWS::SSM::Parameter::Value<String>'
    Description: The ARN of the CodeConnections GitHub connection

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups: 
      - 
        Label: 
          default: "Github repository"
        Parameters: 
          - ConfigRepositoryName
          - CodeRepositoryName
          - BlueprintRepositoryName
          - BranchName
          - CodeConnectionArn
      - 
        Label: 
          default: "CodeBuild job"
        Parameters: 
          - EnvironmentType
          - VPCID
          - Subnets
          - SecurityGroupIds  
          - BlueprintLaunchRoleNamePattern
          - ArtifactBucket
    ParameterLabels:
      ConfigRepositoryName:
        default: Configuration Repository name
      BranchName:
        default: Configuration Repository branch name
      VPCID:
        default: VPC
      Subnets:
        default: Subnets
      SecurityGroupIds:
        default: Security Group
      BlueprintLaunchRoleNamePattern:
        default: Blueprint launch constraint role name pattern
      ArtifactBucket:
        default: Artifact S3 bucket
Resources:
  ##########################################################################
  # IAM - each principal gets its own least-privilege role.
  # Previously a single, manually created role was shared by CodeBuild, the
  # Service Catalog launch constraint and the cleanup Lambda function.
  ##########################################################################
  rTransformExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: [lambda.amazonaws.com]
            Action: ['sts:AssumeRole']
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Path: /
  rTransformExecutionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      Description: Permissions for the ReplicateWith CloudFormation macro function
      Roles:
        - !Ref rTransformExecutionRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: WriteFunctionLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource:
              - !GetAtt rTransformFunctionLogGroup.Arn
          # Describe calls do not support resource-level permissions
          - Sid: DescribeVpcResources
            Effect: Allow
            Action:
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
            Resource: '*'
          # ENI management required for a VPC-attached Lambda function, scoped to this account and Region
          - Sid: ManageFunctionNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*'

  # Service role for the CodeBuild projects that run the Portfolio, Portfolio-shares,
  # Product and Product-tenant scripts.
  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Service role for the Blueprint Factory CodeBuild projects
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Path: /
  CodeBuildServicePolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: >-
              The Service Catalog actions in statement ServiceCatalogActionsWithoutResourceLevelPermissions do not
              support resource-level permissions (see the Service Authorization Reference), so they require
              Resource '*'. They are limited to this Region with aws:RequestedRegion.
    Properties:
      Description: Least-privilege permissions for the Blueprint Factory CodeBuild projects
      Roles:
        - !Ref CodeBuildServiceRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: WriteBuildLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt CodeBuildProjectLogGroup.Arn
          # Required for CodeBuild projects that run inside a VPC
          - Sid: DescribeVpcResources
            Effect: Allow
            Action:
              - ec2:DescribeDhcpOptions
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
            Resource: '*'
          - Sid: ManageBuildNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
            Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*'
          - Sid: AuthorizeCodeBuildNetworkInterfaces
            Effect: Allow
            Action: ec2:CreateNetworkInterfacePermission
            Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:network-interface/*'
            Condition:
              StringEquals:
                'ec2:AuthorizedService': codebuild.amazonaws.com
          - Sid: PipelineArtifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
              - s3:PutObject
              - s3:GetBucketAcl
              - s3:GetBucketLocation
            Resource:
              - !GetAtt CodePipelineArtifactStoreBucket.Arn
              - !Sub '${CodePipelineArtifactStoreBucket.Arn}/*'
          # Packaged product templates (aws cloudformation package and template uploads)
          - Sid: ProductTemplateBucket
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}'
              - !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/*'
          - Sid: BlueprintParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:GetParametersByPath
              - ssm:PutParameter
              - ssm:DeleteParameter
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blueprints/*'
          - Sid: ServiceCatalogPortfolioAndProductAdministration
            Effect: Allow
            Action:
              - servicecatalog:AssociatePrincipalWithPortfolio
              - servicecatalog:AssociateTagOptionWithResource
              - servicecatalog:CreateConstraint
              - servicecatalog:CreatePortfolio
              - servicecatalog:CreatePortfolioShare
              - servicecatalog:CreateProduct
              - servicecatalog:CreateProvisioningArtifact
              - servicecatalog:DeletePortfolio
              - servicecatalog:DeletePortfolioShare
              - servicecatalog:DeleteProduct
              - servicecatalog:DescribePortfolio
              - servicecatalog:DescribePortfolioShares
              - servicecatalog:DescribeProduct
              - servicecatalog:DescribeProductAsAdmin
              - servicecatalog:DescribeProvisioningArtifact
              - servicecatalog:DisassociatePrincipalFromPortfolio
              - servicecatalog:DisassociateTagOptionFromResource
              - servicecatalog:ListLaunchPaths
              - servicecatalog:ListPortfoliosForProduct
              - servicecatalog:ListPrincipalsForPortfolio
              - servicecatalog:ListProvisioningArtifacts
              - servicecatalog:ProvisionProduct
              - servicecatalog:UpdatePortfolio
              - servicecatalog:UpdateProduct
            Resource:
              - !Sub 'arn:${AWS::Partition}:catalog:${AWS::Region}:${AWS::AccountId}:portfolio/*'
              - !Sub 'arn:${AWS::Partition}:catalog:${AWS::Region}:${AWS::AccountId}:product/*'
          - Sid: ServiceCatalogActionsWithoutResourceLevelPermissions
            Effect: Allow
            Action:
              - servicecatalog:AssociateProductWithPortfolio
              - servicecatalog:DeleteTagOption
              - servicecatalog:DescribeProvisionedProduct
              - servicecatalog:DescribeRecord
              - servicecatalog:DisassociateProductFromPortfolio
              - servicecatalog:ListPortfolios
              - servicecatalog:ListTagOptions
              - servicecatalog:SearchProductsAsAdmin
              - servicecatalog:SearchProvisionedProducts
              - servicecatalog:TerminateProvisionedProduct
              - servicecatalog:UpdateProvisionedProduct
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref 'AWS::Region'
          # Read-only lookups Service Catalog performs when sharing portfolios with an AWS Organization
          - Sid: ReadOrganizationForPortfolioShares
            Effect: Allow
            Action:
              - organizations:DescribeOrganization
              - organizations:DescribeAccount
              - organizations:ListAWSServiceAccessForOrganization
            Resource: '*'
          # Launch constraints: only the bootstrap launch role and the configured blueprint launch roles,
          # and only to Service Catalog
          - Sid: PassLaunchConstraintRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !GetAtt BootstrapLaunchRole.Arn
              - !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${BlueprintLaunchRoleNamePattern}'
            Condition:
              StringEquals:
                'iam:PassedToService': servicecatalog.amazonaws.com

  # Launch constraint role for the Bootstrapping-Admin-Product. Service Catalog assumes this role
  # to provision the blueprint release pipeline stack (Product/bp-pipeline/bp-pipeline.yaml).
  # Service Catalog names those stacks SC-<account>-pp-<id>, so CloudFormation-generated
  # resource names start with "SC-".
  BootstrapLaunchRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Service Catalog launch role for the Blueprint Factory admin product
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: servicecatalog.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Path: /
  BootstrapLaunchPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: >-
              servicecatalog:AssociateProductWithPortfolio and DisassociateProductFromPortfolio do not support
              resource-level permissions, so they require Resource '*'. They are limited to this Region with
              aws:RequestedRegion.
    Properties:
      Description: Least-privilege permissions to provision the blueprint release pipeline stack
      Roles:
        - !Ref BootstrapLaunchRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: ManageProvisionedStacks
            Effect: Allow
            Action:
              - cloudformation:CreateStack
              - cloudformation:UpdateStack
              - cloudformation:DeleteStack
              - cloudformation:DescribeStacks
              - cloudformation:DescribeStackEvents
              - cloudformation:ListStackResources
              - cloudformation:SetStackPolicy
              - cloudformation:CreateChangeSet
              - cloudformation:DescribeChangeSet
              - cloudformation:ExecuteChangeSet
              - cloudformation:DeleteChangeSet
              - cloudformation:ListChangeSets
              - cloudformation:TagResource
              - cloudformation:UntagResource
            Resource: !Sub 'arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:*'
          - Sid: ValidateTemplates
            Effect: Allow
            Action:
              - cloudformation:ValidateTemplate
              - cloudformation:GetTemplateSummary
            Resource: '*'
          # Templates staged by Service Catalog (see "Launch constraint" in the Service Catalog Administrator Guide)
          - Sid: ReadServiceCatalogStagedTemplates
            Effect: Allow
            Action: s3:GetObject
            Resource: '*'
            Condition:
              StringEquals:
                's3:ExistingObjectTag/servicecatalog:provisioning': 'true'
          - Sid: ReadProductTemplates
            Effect: Allow
            Action: s3:GetObject
            Resource: !Sub 'arn:${AWS::Partition}:s3:::${ArtifactBucket}/*'
          - Sid: InvokeReplicateWithMacro
            Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt rTransformFunction.Arn
          - Sid: ManagePipelineRoles
            Effect: Allow
            Action:
              - iam:CreateRole
              - iam:DeleteRole
              - iam:GetRole
              - iam:TagRole
              - iam:UntagRole
              - iam:UpdateAssumeRolePolicy
              - iam:PutRolePolicy
              - iam:DeleteRolePolicy
              - iam:GetRolePolicy
              - iam:ListRolePolicies
              - iam:ListAttachedRolePolicies
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/SC-*'
          - Sid: PassPipelineRoles
            Effect: Allow
            Action: iam:PassRole
            Resource: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:role/SC-*'
            Condition:
              StringEquals:
                'iam:PassedToService':
                  - codebuild.amazonaws.com
                  - codepipeline.amazonaws.com
          - Sid: ManageBuildProjects
            Effect: Allow
            Action:
              - codebuild:CreateProject
              - codebuild:UpdateProject
              - codebuild:DeleteProject
              - codebuild:BatchGetProjects
            Resource: !Sub 'arn:${AWS::Partition}:codebuild:${AWS::Region}:${AWS::AccountId}:project/*'
          - Sid: ManagePipelines
            Effect: Allow
            Action:
              - codepipeline:CreatePipeline
              - codepipeline:UpdatePipeline
              - codepipeline:DeletePipeline
              - codepipeline:GetPipeline
              - codepipeline:GetPipelineState
              - codepipeline:TagResource
              - codepipeline:UntagResource
              - codepipeline:ListTagsForResource
            Resource: !Sub 'arn:${AWS::Partition}:codepipeline:${AWS::Region}:${AWS::AccountId}:BluePrint_*'
          - Sid: PassSourceConnection
            Effect: Allow
            Action:
              - codeconnections:PassConnection
              - codeconnections:UseConnection
              - codestar-connections:PassConnection
              - codestar-connections:UseConnection
            Resource: !Ref CodeConnectionArn
          - Sid: DescribeLogGroups
            Effect: Allow
            Action: logs:DescribeLogGroups
            Resource: '*'
          - Sid: ManagePipelineLogGroups
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:DeleteLogGroup
              - logs:PutRetentionPolicy
              - logs:DeleteRetentionPolicy
              - logs:TagResource
              - logs:UntagResource
              - logs:TagLogGroup
              - logs:ListTagsForResource
            Resource:
              - !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:SC-*'
          - Sid: ManageBlueprintParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:GetParameters
              - ssm:PutParameter
              - ssm:DeleteParameter
              - ssm:AddTagsToResource
              - ssm:RemoveTagsFromResource
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blueprints/*'
          - Sid: DescribeParameters
            Effect: Allow
            Action: ssm:DescribeParameters
            Resource: '*'
          - Sid: ManageBlueprintProducts
            Effect: Allow
            Action:
              - servicecatalog:CreateProduct
              - servicecatalog:UpdateProduct
              - servicecatalog:DeleteProduct
              - servicecatalog:DescribeProductAsAdmin
              - servicecatalog:CreateProvisioningArtifact
              - servicecatalog:DeleteProvisioningArtifact
              - servicecatalog:DescribeProvisioningArtifact
              - servicecatalog:UpdateProvisioningArtifact
              - servicecatalog:ListProvisioningArtifacts
              - servicecatalog:ListPortfoliosForProduct
            Resource: !Sub 'arn:${AWS::Partition}:catalog:${AWS::Region}:${AWS::AccountId}:product/*'
          - Sid: ManageProductPortfolioAssociations
            Effect: Allow
            Action:
              - servicecatalog:AssociateProductWithPortfolio
              - servicecatalog:DisassociateProductFromPortfolio
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref 'AWS::Region'
          # CodeBuild validates the VPC configuration of the pipeline's build projects
          - Sid: DescribeVpcResources
            Effect: Allow
            Action:
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
            Resource: '*'

  # Role for the cleanup custom resource that removes the admin product and portfolio on stack deletion
  CleanupFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Execution role for the Blueprint Factory cleanup function
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: 'sts:AssumeRole'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
      Path: /
  CleanupFunctionPolicy:
    Type: AWS::IAM::ManagedPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_111
            comment: >-
              servicecatalog:DisassociateProductFromPortfolio does not support resource-level permissions, so it
              requires Resource '*'. It is limited to this Region with aws:RequestedRegion.
    Properties:
      Description: Permissions for the Blueprint Factory cleanup function
      Roles:
        - !Ref CleanupFunctionRole
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: WriteFunctionLogs
            Effect: Allow
            Action:
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !GetAtt CleanupFunctionLogGroup.Arn
          - Sid: DescribeVpcResources
            Effect: Allow
            Action:
              - ec2:DescribeNetworkInterfaces
              - ec2:DescribeSubnets
              - ec2:DescribeSecurityGroups
              - ec2:DescribeVpcs
            Resource: '*'
          - Sid: ManageFunctionNetworkInterfaces
            Effect: Allow
            Action:
              - ec2:CreateNetworkInterface
              - ec2:DeleteNetworkInterface
              - ec2:AssignPrivateIpAddresses
              - ec2:UnassignPrivateIpAddresses
            Resource: !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:*'
          - Sid: RemoveAdminParameters
            Effect: Allow
            Action:
              - ssm:GetParameter
              - ssm:DeleteParameter
            Resource: !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/blueprints/service-catalog/${EnvironmentType}/*'
          - Sid: RemoveAdminPortfolioAndProduct
            Effect: Allow
            Action:
              - servicecatalog:ListPrincipalsForPortfolio
              - servicecatalog:DisassociatePrincipalFromPortfolio
              - servicecatalog:DeletePortfolio
              - servicecatalog:DeleteProduct
            Resource:
              - !Sub 'arn:${AWS::Partition}:catalog:${AWS::Region}:${AWS::AccountId}:portfolio/*'
              - !Sub 'arn:${AWS::Partition}:catalog:${AWS::Region}:${AWS::AccountId}:product/*'
          - Sid: DisassociateAdminProduct
            Effect: Allow
            Action: servicecatalog:DisassociateProductFromPortfolio
            Resource: '*'
            Condition:
              StringEquals:
                'aws:RequestedRegion': !Ref 'AWS::Region'
  CleanupFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Log data is encrypted at rest by CloudWatch Logs by default. Add KmsKeyId if your organization requires a customer managed key.
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-admin-product-portfolio-cleanup
      RetentionInDays: 365
  rTransformFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Log data is encrypted at rest by CloudWatch Logs by default. Add KmsKeyId if your organization requires a customer managed key.
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-replication-macro
      RetentionInDays: 365
  rTransformFunction:
    Type: AWS::Lambda::Function
    DependsOn: rTransformExecutionPolicy
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_115
            comment: CloudFormation macro invoked synchronously and only at deploy time; reserving concurrency would take capacity from the account's unreserved pool.
          - id: CKV_AWS_116
            comment: Invoked synchronously by CloudFormation; failures are returned to the stack operation, so a dead-letter queue would never receive events.
      guard:
        SuppressedRules:
          - LAMBDA_CONCURRENCY_CHECK
          - LAMBDA_DLQ_CHECK
    Properties:
      FunctionName: !Sub ${AWS::StackName}-replication-macro
      MemorySize: 128
      Timeout: 30
      VpcConfig:
        SecurityGroupIds: !Ref SecurityGroupIds
        SubnetIds:
          - !Select [ 0, !Ref Subnets ]
      Code:
        ZipFile: |
          import boto3
          import copy
          import json
          import logging

          log = logging.getLogger()
          log.setLevel(logging.INFO)

          DEFAULT_KEYWORD = 'ReplicateWith'

          def process_template(event):
              """
              Creates identical resources iteratively with one unique resource property
              """
              try:
                fragment = event['fragment']
                final_fragment = copy.deepcopy(fragment)
                parameters = event['templateParameterValues']
                resources = fragment['Resources']
                for resource_name, resource_values in resources.items():
                    current_resource = resources[resource_name]
                    log.info('Current Resource:: ' + str(current_resource))
                    if DEFAULT_KEYWORD in resource_values['Properties']:
                        log.info('Resource_name:: ' + str(resource_name))
                        log.info('Resource_value:: ' + str(resource_values))

                        # Move to a different block
                        for key, value in resource_values['Properties'][DEFAULT_KEYWORD].items():
                            log.debug('Replicate Key:: ' + key)
                            log.debug('Replicate Value:: ' + value)

                            #Split the comma separated properties
                            resource_properties = parameters[value].split(',')
                            log.debug('New Properties:: ' + str(resource_properties))

                            #Pop the DEFAULT_KEYWORD
                            resource_values['Properties'].pop(DEFAULT_KEYWORD)
                            length_resource_properties = len(resource_properties)
                            log.debug('length of properties:: ' + str(length_resource_properties))

                            # Duplicating resources with unique property values
                            if length_resource_properties > 0:
                                get_final_fragment(length_resource_properties, resource_name, resource_properties, final_fragment, current_resource, key)
                                final_fragment['Resources'].pop(resource_name)
                return final_fragment
              except Exception as e:
                log.error('Error occurred:: ' + str(e))

          def get_final_fragment(length_resource_properties, resource_name, resource_properties, final_fragment, current_resource, key):
              for x in range(0, length_resource_properties):
                  # Specific to portfolioId related resources
                  if resource_properties[x].startswith("port-"):
                      final_fragment['Resources'][resource_name + resource_properties[x].strip("port-")] = copy.deepcopy(current_resource)
                      final_fragment['Resources'][resource_name + resource_properties[x].strip("port-")]['Properties'][key] = resource_properties[x].strip()
                      if resource_name=='TemplateLaunchRoleConstraint' or resource_name=='ResourceUpdateConstraint':
                          final_fragment['Resources'][resource_name + resource_properties[x].strip("port-")]['DependsOn'] = 'AssociateProduct' + resource_properties[x].strip("port-")
                  else:
                      final_fragment['Resources'][resource_name + str(x+1)] = copy.deepcopy(current_resource)
                      final_fragment['Resources'][resource_name + str(x+1)]['Properties'][key] = resource_properties[x].strip()
                      
          def handler(event, context):
              """
              Returns processed template back to CloudFormation
              """
              log.info(json.dumps(event))
              processed_template=process_template(event)
              log.info('Processed template' + json.dumps(processed_template))

              r = {}
              r['requestId'] = event['requestId']
              r['status'] = 'SUCCESS'
              r['fragment'] = processed_template

              return r

      Handler: index.handler
      Runtime: python3.12
      Role: !GetAtt rTransformExecutionRole.Arn
  rTransformFunctionPermissions:
    Type: AWS::Lambda::Permission
    Properties:
      Action: 'lambda:InvokeFunction'
      FunctionName: !GetAtt rTransformFunction.Arn
      Principal: 'cloudformation.amazonaws.com'
      # Prevent cross-account (confused deputy) invocation through the CloudFormation service principal
      SourceAccount: !Ref 'AWS::AccountId'
  rTransform:
    Type: AWS::CloudFormation::Macro
    Properties:
      Name: 'ReplicateWith'
      Description: Replicates the resources based on parameters provided
      FunctionName: !GetAtt rTransformFunction.Arn
  CodeBuildProjectLogGroup:
    Type: AWS::Logs::LogGroup
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_158
            comment: Log data is encrypted at rest by CloudWatch Logs by default. Add KmsKeyId if your organization requires a customer managed key.
      guard:
        SuppressedRules:
          - CLOUDWATCH_LOG_GROUP_ENCRYPTED
    Properties:
      RetentionInDays: 365
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
  AccessLogsBucket:
    Type: 'AWS::S3::Bucket'
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: This bucket is the server access logging destination; logging it to itself would cause a loop.
      guard:
        SuppressedRules:
          - S3_BUCKET_LOGGING_ENABLED
          - S3_DEFAULT_ENCRYPTION_KMS
          - S3_BUCKET_DEFAULT_LOCK_ENABLED
          - S3_BUCKET_REPLICATION_ENABLED  # cross-Region replication is a customer DR decision, out of scope for this sample
      cfn_nag:
        rules_to_suppress:
          - id: W35
            reason: This bucket is the server access logging destination.
    UpdateReplacePolicy: Retain
    DeletionPolicy: Retain
    Properties:
      # S3 server access logging only supports SSE-S3 on the destination bucket.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
  AccessLogsBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY  # DenyInsecureConnections denies all s3:* over non-TLS on the bucket and its objects
    Properties:
      Bucket: !Ref AccessLogsBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowS3ServerAccessLogging
            Effect: Allow
            Principal:
              Service: logging.s3.amazonaws.com
            Action: 's3:PutObject'
            Resource: !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              StringEquals:
                'aws:SourceAccount': !Ref 'AWS::AccountId'
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt AccessLogsBucket.Arn
              - !Sub '${AccessLogsBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false
  CodePipelineArtifactStoreBucket:
    Type: 'AWS::S3::Bucket'
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_REPLICATION_ENABLED   # pipeline artifacts are transient and reproducible from source
          - S3_BUCKET_DEFAULT_LOCK_ENABLED  # pipeline artifacts are transient; versioning protects against overwrites
          - S3_BUCKET_NO_PUBLIC_RW_ACL      # public ACLs are blocked and ignored by PublicAccessBlockConfiguration
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
        - ServerSideEncryptionByDefault:
            SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LoggingConfiguration:
        DestinationBucketName: !Ref AccessLogsBucket
        LogFilePrefix: codepipeline-artifacts/
  CodePipelineArtifactStoreBucketPolicy:
    Type: 'AWS::S3::BucketPolicy'
    Metadata:
      guard:
        SuppressedRules:
          - S3_BUCKET_SSL_REQUESTS_ONLY  # DenyInsecureConnections denies all s3:* over non-TLS on the bucket and its objects
    Properties:
      Bucket: !Ref CodePipelineArtifactStoreBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: DenyUnEncryptedObjectUploads
            Effect: Deny
            Principal: '*'
            Action: 's3:PutObject'
            Resource: !Join 
              - ''
              - - !GetAtt 
                  - CodePipelineArtifactStoreBucket
                  - Arn
                - /*
            Condition:
              'Null':
                's3:x-amz-server-side-encryption': true
          - Sid: DenyInsecureConnections
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt
                - CodePipelineArtifactStoreBucket
                - Arn
              - !Join
                - ''
                - - !GetAtt
                    - CodePipelineArtifactStoreBucket
                    - Arn
                  - /*
            Condition:
              Bool:
                'aws:SecureTransport': false
